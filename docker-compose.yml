services:
  game:
    build: .
    ports:
      - "6080:6080"
    volumes:
      - sine-output:/output
    shm_size: "256m"
    restart: unless-stopped

  x11:
    build: .
    profiles: ["x11"]
    environment:
      DISPLAY: "${DISPLAY}"
      LIBGL_ALWAYS_SOFTWARE: "1"
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - sine-output:/output
    command: ["python", "game.py", "--out", "/output"]

  gpu:
    build: .
    profiles: ["gpu"]
    ports:
      - "6081:6080"
    devices:
      - /dev/dri:/dev/dri
    environment:
      LIBGL_ALWAYS_SOFTWARE: "0"
      GALLIUM_DRIVER: ""
    volumes:
      - sine-output:/output
    shm_size: "256m"

volumes:
  sine-output:
